openapi: 3.0.3
info:
  title: ApexStock Flash Sale API Contract
  version: 1.0.0
  description: |
    Unified OpenAPI 3.0 contract cho cả 2 kiến trúc Baseline (:8081) và Optimized (:8082) theo Decision Gate D0 (D0.1, D0.2, D0.4, D0.6, D0.7).
servers:
  - url: http://localhost:8081
    description: Baseline Architecture (Direct PostgreSQL SELECT FOR UPDATE)
  - url: http://localhost:8082
    description: Optimized Architecture (Nginx -> Go API -> Redis/Lua -> NATS JetStream -> Worker)

paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getLiveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      summary: Readiness probe (checks downstream DB/Redis/NATS dependencies)
      operationId: getReadiness
      responses:
        "200":
          description: Service and dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Dependency unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/flash-sale/orders:
    post:
      summary: Đặt mua 1 sản phẩm Flash Sale (Common Endpoint D0.2 & Single-Item D0.4)
      operationId: createFlashSaleOrder
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Correlation-ID
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created / reserved durably (D0.1)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          description: Validation error (invalid quantity, missing fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Flash sale item or event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Business conflict (OUT_OF_STOCK, IDEMPOTENCY_KEY_PAYLOAD_MISMATCH, ORDER_LIMIT_EXCEEDED, SALE_NOT_ACTIVE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Downstream dependency unavailable / circuit open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/flash-sale/orders/{order_id}:
    get:
      summary: Truy vấn trạng thái đơn hàng
      operationId: getFlashSaleOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/payments/simulate:
    post:
      summary: Payment Simulator cho k6 benchmark & local testing (D0.6)
      operationId: simulatePayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulatePaymentRequest"
      responses:
        "200":
          description: Payment transition processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResultResponse"
        "409":
          description: Invalid state transition or expired order (D0.7)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/webhooks/sepay:
    post:
      summary: Webhook nhận kết quả thanh toán thực tế từ SePay cho UI demo (D0.6, D0.7)
      operationId: handleSepayWebhook
      responses:
        "200":
          description: Webhook acknowledged (idempotent)

components:
  schemas:
    CreateOrderRequest:
      type: object
      required:
        - user_id
        - flash_sale_id
        - item_id
        - quantity
      properties:
        user_id:
          type: string
          format: uuid
        flash_sale_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 5

    CreateOrderResponse:
      type: object
      required:
        - order_id
        - reservation_id
        - user_id
        - flash_sale_id
        - item_id
        - quantity
        - unit_price
        - total_amount
        - status
        - payment_status
        - expires_at
        - created_at
      properties:
        order_id:
          type: string
          format: uuid
        reservation_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        flash_sale_id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        quantity:
          type: integer
        unit_price:
          type: number
        total_amount:
          type: number
        status:
          type: string
          enum: [pending_payment, paid, payment_failed, expired, cancelled]
        payment_status:
          type: string
          enum: [pending, completed, failed, expired, refund]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    SimulatePaymentRequest:
      type: object
      required:
        - order_id
        - outcome
      properties:
        order_id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [success, failure, timeout, cancel]
        provider_tx_id:
          type: string

    PaymentResultResponse:
      type: object
      required:
        - order_id
        - order_status
        - payment_status
        - idempotent_replay
      properties:
        order_id:
          type: string
          format: uuid
        order_status:
          type: string
        payment_status:
          type: string
        idempotent_replay:
          type: boolean

    HealthResponse:
      type: object
      required:
        - status
        - arch
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        arch:
          type: string
          enum: [baseline, optimized]
        dependencies:
          type: object
          additionalProperties:
            type: string

    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            correlation_id:
              type: string
            details:
              type: object
              additionalProperties: true
