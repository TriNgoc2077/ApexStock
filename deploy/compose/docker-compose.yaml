services:
  # PostgreSQL — 2 databases: apexstock_baseline, apexstock_optimized (D0.15)
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: apexstock
      POSTGRES_PASSWORD: apexstock
      POSTGRES_DB: postgres
    volumes:
      - ./deploy/docker/postgres-init.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexstock"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - dev
      - demo
      - benchmark
      - observability

  # Redis — noeviction policy (D0.13)
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 640m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles:
      - dev
      - demo
      - benchmark
      - observability

  # NATS JetStream (persistent)
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles:
      - dev
      - demo
      - benchmark
      - observability

  # Baseline API (:8081)
  api-baseline:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api-baseline
    environment:
      BASELINE_PORT: 8081
      BASELINE_DSN: postgres://apexstock:apexstock@postgres:5432/apexstock_baseline?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024m
    profiles:
      - dev
      - demo
      - benchmark

  # Optimized API (:8082) — behind nginx in demo/benchmark profiles
  api-optimized:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api-optimized
    environment:
      OPTIMIZED_PORT: 8082
      OPTIMIZED_DSN: postgres://apexstock:apexstock@postgres:5432/apexstock_optimized?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384m
      replicas: 2
    profiles:
      - demo
      - benchmark

  # Nginx LB for Optimized API
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8082:8082"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-optimized
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    profiles:
      - demo
      - benchmark

  # Worker — consumes NATS JetStream
  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    environment:
      OPTIMIZED_DSN: postgres://apexstock:apexstock@postgres:5432/apexstock_optimized?sslmode=disable
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    profiles:
      - dev
      - demo
      - benchmark

  # War Room Controller
  warroom-controller:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.warroom-controller
    ports:
      - "9000:9000"
    profiles:
      - demo

  # Next.js Web UI
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BASELINE_URL: http://localhost:8081
      NEXT_PUBLIC_OPTIMIZED_URL: http://localhost:8082
      NEXT_PUBLIC_WARROOM_WS_URL: ws://localhost:9000/ws
    profiles:
      - demo

  # Prometheus
  prometheus:
    image: prom/prometheus:v3.2.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    profiles:
      - observability
      - demo
      - benchmark

  # Grafana
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    profiles:
      - observability
      - demo
      - benchmark

volumes:
  postgres_data:
  nats_data:
  prometheus_data:
  grafana_data:
