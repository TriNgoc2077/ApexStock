user nginx;
worker_processes 4;            # khớp với 1.0 CPU limit, 4 worker processes
worker_rlimit_nofile 65535;
error_log /dev/null crit;      # tắt error log để giảm disk I/O
pid /var/run/nginx.pid;

events {
    worker_connections 16384;  # 4 × 16384 = 65536 tổng connections
    use epoll;
    multi_accept on;
    accept_mutex off;          # tắt mutex khi có nhiều workers — giảm latency
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Tắt hoàn toàn access log — loại bỏ disk I/O bottleneck
    access_log off;
    error_log /dev/null crit;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keepalive settings — giảm TCP handshake overhead
    keepalive_timeout 120s;
    keepalive_requests 10000;

    # Tăng buffer sizes cho high-throughput
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Gzip off — flash-sale payload nhỏ, không cần compress
    gzip off;

    # Reset linger — trả connection về pool nhanh hơn
    reset_timedout_connection on;

    upstream api_optimized_backend {
        least_conn;
        server api-optimized:8082 max_fails=3 fail_timeout=5s;

        # Keepalive pool tới backend — QUAN TRỌNG cho high RPS
        keepalive 512;
        keepalive_requests 50000;
        keepalive_time 300s;
        keepalive_timeout 120s;
    }

    server {
        listen 8082 reuseport backlog=65535;
        server_name _;

        location / {
            proxy_pass http://api_optimized_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffers 32 16k;
            proxy_buffer_size 16k;
            proxy_busy_buffers_size 64k;

            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /healthz {
            access_log off;
            proxy_pass http://api_optimized_backend;
        }

        location /readyz {
            access_log off;
            proxy_pass http://api_optimized_backend;
        }
    }
}
