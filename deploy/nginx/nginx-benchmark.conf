user nginx;
worker_processes 4;
worker_rlimit_nofile 131072;
error_log /dev/null crit;
pid /var/run/nginx.pid;

events {
    worker_connections 32768;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    error_log /dev/null crit;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 120s;
    keepalive_requests 100000;

    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    gzip off;
    reset_timedout_connection on;

    upstream api_optimized_backend {
        least_conn;
        server 172.18.0.11:8082 max_fails=0;
        server 172.18.0.9:8082  max_fails=0;
        server 172.18.0.13:8082 max_fails=0;

        keepalive 2048;
        keepalive_requests 100000;
        keepalive_time 600s;
        keepalive_timeout 120s;
    }

    server {
        listen 8082 reuseport backlog=65535;
        server_name _;

        location / {
            proxy_pass http://api_optimized_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffers 32 16k;
            proxy_buffer_size 16k;
            proxy_busy_buffers_size 64k;

            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /healthz {
            access_log off;
            proxy_pass http://api_optimized_backend;
        }

        location /readyz {
            access_log off;
            proxy_pass http://api_optimized_backend;
        }
    }
}
