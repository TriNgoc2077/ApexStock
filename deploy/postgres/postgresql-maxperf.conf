# =============================================================================
# postgresql-maxperf.conf — PostgreSQL tuning cho 40-50k RPS flash-sale
# Máy: i5-10500H, 4 CPUs allocated, 3GB RAM allocated
#
# Công thức:
#   shared_buffers    = 25% RAM container  = ~750MB
#   effective_cache_size = 75% RAM         = ~2250MB
#   work_mem          = (RAM - shared) / (max_conn * 3) = modest per-sort
#   wal_buffers       = 3% RAM hoặc 64MB max
# =============================================================================

# --- Connection Settings ---
max_connections = 400           # 3 replicas × ~60 conn/each + baseline ~100 + worker ~20 + slack

# --- Memory ---
shared_buffers = 768MB          # 25% of 3GB container RAM
effective_cache_size = 2304MB   # 75% of 3GB — hint cho query planner
work_mem = 2MB                  # nhỏ thôi vì có nhiều connections đồng thời
maintenance_work_mem = 128MB
wal_buffers = 64MB

# --- Checkpoint / WAL ---
checkpoint_completion_target = 0.9
wal_compression = on
min_wal_size = 512MB
max_wal_size = 2GB
checkpoint_timeout = 15min      # tránh checkpoint giữa benchmark làm spike latency

# --- WAL Level — minimal để giảm overhead (không cần replication) ---
wal_level = minimal
max_wal_senders = 0
archive_mode = off

# --- Disk I/O ---
random_page_cost = 1.1          # SSD (hoặc ramdisk hiệu quả của Docker)
effective_io_concurrency = 200  # SSD concurrent I/O
seq_page_cost = 1.0

# --- Query Planner ---
default_statistics_target = 100

# --- Background Writer ---
bgwriter_lru_maxpages = 200
bgwriter_delay = 50ms

# --- Autovacuum — disable trong benchmark để loại bỏ background noise ---
autovacuum = off

# --- Parallelism ---
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# --- Logging — tắt gần hết để giảm I/O ---
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = -1   # tắt slow query log
log_checkpoints = off
log_connections = off
log_disconnections = off
log_lock_waits = off
track_activities = off
track_counts = off
track_io_timing = off

# --- Misc ---
synchronous_commit = off        # QUAN TRỌNG: tăng throughput, chấp nhận mất ≤1 WAL buffer (~64MB) khi crash
                                # An toàn cho benchmark — không dùng cho production financial data
fsync = on                      # giữ fsync để tránh data corruption, synchronous_commit=off là đủ
full_page_writes = off          # tắt được khi không có base backup đang chạy → giảm WAL size
