global:
  scrape_interval: 2s
  evaluation_interval: 2s
  external_labels:
    cluster: 'apexstock-local'

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Baseline
  - job_name: 'api-baseline'
    static_configs:
      - targets: ['api-baseline:8081']
    metrics_path: /metrics

  # API Optimized (Scrapes all replicas directly via Docker DNS)
  - job_name: 'api-optimized'
    dns_sd_configs:
      - names:
          - 'api-optimized'
        type: 'A'
        port: 8082
        refresh_interval: 2s
    metrics_path: /metrics

  # Worker
  - job_name: 'worker'
    static_configs:
      - targets: ['worker:8080']
    metrics_path: /metrics
