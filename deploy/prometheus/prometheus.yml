global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'apexstock-local'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Baseline
  - job_name: 'api-baseline'
    static_configs:
      - targets: ['api-baseline:8081']
    metrics_path: /metrics

  # API Optimized (via nginx)
  - job_name: 'api-optimized'
    static_configs:
      - targets: ['nginx:8082']
    metrics_path: /metrics

  # Worker
  - job_name: 'worker'
    static_configs:
      - targets: ['worker:8080']
    metrics_path: /metrics

  # Redis exporter placeholder (Stage 7)
